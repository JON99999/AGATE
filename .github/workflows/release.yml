name: Build/Release Electron App

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v2.0.1

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Install Rust Toolchain for Tauri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Build Tauri App
        run: npm run dist:tauri

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.exe
            release/*.zip
            release/tauri/*-tauri.dmg
            release/tauri/*-tauri.msi
            release/tauri/*-tauri.exe
            release/tauri/*-tauri.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
