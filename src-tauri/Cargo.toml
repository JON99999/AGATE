[package]
name = "interstitial-er"
version = "0.8.14"
description = "Cross-platform Desktop MP3 Scheduler optimized for MacOS and Windows co-developed with Electron."
authors = ["JON99999"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "api-all", "dialog" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# by default Tauri runs in production mode
# when building for production, custom protocols are enabled
custom-protocol = [ "tauri/custom-protocol" ]
